version: "1"
types:
  overrides:
    - go_type: "string"
      ts_type: "string"
      js_type: "string"
      swift_type: "String"
      dart_type: "String"
    - go_type: "interface{}"
      js_type: "any"
      ts_type: "object"
      swift_type: "Any"
      dart_type: "dynamic"
    - go_type: "map[string]interface{}"
      js_type: "object"
      ts_type: "object"
      swift_type: "Any"
      dart_type: "Map<String, dynamic>"
    - go_type: "github.com/acme/project/foo.Bar"
      ts_type: "FooBar"
